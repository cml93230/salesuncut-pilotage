# Réveil de la base SalesUncut (23/09/2026).
# Le projet Supabase est sur le plan gratuit : sept jours sans aucune requête et
# il se met en pause tout seul, le site devient muet sans message (arrivé en
# juillet 2026). Depuis que les scénarios Make sont éteints, plus rien ne le
# réveillait à part les visites. Cette tâche appelle toutes les six heures une
# fonction publique du site (le compte de candidats certifiés, déjà servi à tout
# visiteur) avec la clé publiable, écrite en clair dans chaque page du site :
# aucun secret ici. Un échec ne casse rien ; il se voit dans l'onglet Actions.
name: reveil-base
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la base
        run: |
          code=$(curl -s -o /tmp/r.txt -w "%{http_code}" -X POST \
            -H "apikey: sb_publishable_EV-3DNccOU1oZ8TVQMQuGA_hikbGMfB" \
            -H "Authorization: Bearer sb_publishable_EV-3DNccOU1oZ8TVQMQuGA_hikbGMfB" \
            -H "Content-Type: application/json" -d '{}' \
            https://svtyzkypmzmtcqunzfyy.supabase.co/rest/v1/rpc/compte_candidats_certifies)
          echo "réponse $code : $(cat /tmp/r.txt)"
          test "$code" = "200"
      - name: Appeler le site
        run: curl -s -o /dev/null -w "site %{http_code}\n" https://www.salesuncut.com/
